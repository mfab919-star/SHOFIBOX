<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f6fb;--card:#fff;--ink:#1f1530;--muted:#675d7a;--line:#e3dcee;--accent:#6d28d9;--accent-ink:#fff;--chip:#efe9f8}
@media (prefers-color-scheme:dark){:root{--bg:#150f1f;--card:#1e1630;--ink:#f1ecfa;--muted:#a99dc0;--line:#33284a;--accent:#a78bfa;--accent-ink:#1a0f33;--chip:#2a1f40}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;line-height:1.5}
header{padding:40px 20px 8px;max-width:1100px;margin:0 auto}
h1{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:clamp(2rem,6vw,3.2rem);line-height:1.05;margin:0 0 8px;font-weight:800;letter-spacing:-.02em}
header p{margin:0;color:var(--muted);max-width:50ch}
.tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 20px;max-width:1100px;margin:0 auto}
.search{width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:12px}
.chips-wrap{display:flex;align-items:center;gap:8px}
.chips{flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;scroll-behavior:smooth}
.arrow{display:none;flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.5rem;line-height:1;cursor:pointer;place-items:center;padding:0 0 3px}
.arrow:hover:not(:disabled){background:var(--accent);color:var(--accent-ink)}
.arrow:disabled{opacity:.3;cursor:default}
.arrow:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (min-width:601px){.arrow{display:grid}}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);color:var(--ink);padding:9px 16px;border-radius:999px;font:inherit;font-weight:500;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.chip:focus-visible,.buy:focus-visible,.search:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:8px 20px 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.pic{position:relative;aspect-ratio:1/1;background:#fff;display:grid;place-items:center;font:800 4rem 'Bricolage Grotesque',sans-serif;color:var(--accent);overflow:hidden}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.cat{font-size:.85rem;color:var(--muted)}
.name{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:1.15rem;margin:0}
.desc{font-size:.92rem;color:var(--muted);margin:0;flex:1}
.price{font-weight:600;font-size:1.1rem;margin-top:4px}
.buy{display:block;text-align:center;text-decoration:none;background:var(--accent);color:var(--accent-ink);padding:12px;border-radius:12px;font-weight:600;margin-top:8px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
.float{position:fixed;right:16px;bottom:16px;background:var(--accent);color:var(--accent-ink);padding:14px 20px;border-radius:999px;text-decoration:none;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.pic img{cursor:zoom-in}
.lb{position:fixed;inset:0;z-index:20;background:rgba(15,8,28,.9);display:flex;align-items:center;justify-content:center;padding:16px}
.lb[hidden]{display:none}
.lb figure{margin:0;width:100%;max-width:min(92vw,520px);display:flex;flex-direction:column;align-items:center;gap:12px}
.lb img{max-width:100%;max-height:68vh;object-fit:contain;border-radius:14px;background:#fff}
.lb figcaption{color:#fff;text-align:center;display:flex;flex-direction:column;gap:4px;width:100%}
.lb figcaption strong{font-family:'Bricolage Grotesque',sans-serif;font-size:1.1rem}
.lb-x{position:absolute;top:max(12px,env(safe-area-inset-top));right:14px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:1.2rem;cursor:pointer}
@media (max-width:600px){
  header{padding:28px 14px 4px}
  .tools{padding:10px 14px}
  main{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:6px 14px 90px}
  .card{border-radius:12px}
  .body{padding:9px 10px 11px;gap:3px}
  .cat{font-size:.72rem}
  .name{font-size:.92rem;line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .desc{font-size:.8rem}
  .price{font-size:1rem;margin-top:2px}
  .buy{padding:9px 6px;font-size:.8rem;border-radius:10px;margin-top:6px}
  .pic{font-size:3rem}
  .float{padding:12px 16px;font-size:.9rem}
}
</style>
</head>

/* ============ 3) LÓGICA (no necesitas tocar) ============ */
const wa = txt => `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(txt)}`;
const cop = n => new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(n);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const slug = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const foto = p => p.imagen || ("fotos/" + slug(p.nombre) + ".jpg");
let categoria = "Todos", texto = "";
let categorias = [];
const calcCategorias = () => { categorias = ["Todos", ...new Set(PRODUCTOS.map(p => p.categoria))]; };
calcCategorias();

function pintarFiltros(){
  document.getElementById("chips").innerHTML = categorias.map(c =>
    `<button class="chip" aria-pressed="${c===categoria}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  flechas();
}

/* Flechas para mover las categorías en computador */
const chipsEl = document.getElementById("chips"), prev = document.getElementById("prev"), next = document.getElementById("next");
function flechas(){
  const max = chipsEl.scrollWidth - chipsEl.clientWidth;
  prev.disabled = chipsEl.scrollLeft <= 2;
  next.disabled = chipsEl.scrollLeft >= max - 2;
}
prev.addEventListener("click", () => chipsEl.scrollBy({left: -chipsEl.clientWidth * 0.7}));
next.addEventListener("click", () => chipsEl.scrollBy({left:  chipsEl.clientWidth * 0.7}));
chipsEl.addEventListener("scroll", flechas, {passive:true});
window.addEventListener("resize", flechas);

function pintarProductos(){
  const lista = PRODUCTOS.filter(p =>
    (categoria==="Todos" || p.categoria===categoria) &&
    (p.nombre+" "+p.descripcion).toLowerCase().includes(texto));
  document.getElementById("grid").innerHTML = lista.length ? lista.map(p => `
    <article class="card" data-i="${PRODUCTOS.indexOf(p)}">
      <div class="pic"><img src="${esc(foto(p))}" alt="${esc(p.nombre)}" loading="lazy" onerror="this.parentNode.textContent=this.alt.charAt(0)"></div>
      <div class="body">
        <span class="cat">${esc(p.categoria)}</span>
        <h2 class="name">${esc(p.nombre)}</h2>
        <p class="desc">${esc(p.descripcion)}</p>
        <div class="price">${cop(p.precio)}</div>
        <a class="buy" target="_blank" rel="noopener"
           href="${wa(`Hola, vi en el catálogo de ${NEGOCIO} y quiero comprar: ${p.nombre} (${cop(p.precio)}).`)}">Comprar por WhatsApp</a>
      </div>
    </article>`).join("") : `<p class="empty">No encontramos productos con ese filtro.</p>`;
}

/* Al cambiar de categoría o buscar, sube la vista al inicio de los productos */
function subir(){
  const tope = document.querySelector("header").offsetHeight;
  if (window.scrollY > tope) window.scrollTo({top: tope, behavior: "smooth"});
}
document.getElementById("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if(!b) return;
  categoria = b.dataset.c;
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b));
  pintarProductos(); subir();
});
document.getElementById("q").addEventListener("input", e => { texto = e.target.value.toLowerCase().trim(); pintarProductos(); subir(); });
document.getElementById("ask").href = wa(`Hola, vi el catálogo de ${NEGOCIO} y tengo una pregunta.`);

/* Ampliar foto al tocarla */
const lb = document.getElementById("lb");
document.getElementById("grid").addEventListener("click", e => {
  const img = e.target.closest(".pic img"); if(!img) return;
  const p = PRODUCTOS[+img.closest(".card").dataset.i];
  const g = document.getElementById("lbImg");
  g.src = foto(p); g.alt = p.nombre;
  document.getElementById("lbName").textContent = p.nombre;
  document.getElementById("lbPrice").textContent = cop(p.precio);
  document.getElementById("lbBuy").href = wa(`Hola, vi en el catálogo de ${NEGOCIO} y quiero comprar: ${p.nombre} (${cop(p.precio)}).`);
  lb.hidden = false; document.body.style.overflow = "hidden";
});
function cerrar(){ lb.hidden = true; document.body.style.overflow = ""; }
lb.addEventListener("click", e => { if(!e.target.closest("#lbBuy")) cerrar(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") cerrar(); });

pintarFiltros(); pintarProductos();

/* ============ GOOGLE SHEETS ============ */
function parseCSV(t){
  const rows = []; let row = [], cur = "", q = false;
  t = t.replace(/^\uFEFF/, "");
  for (let i = 0; i < t.length; i++){
    const c = t[i];
    if (q){
      if (c === '"'){ if (t[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ","){ row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r"){
      if (c === "\r" && t[i+1] === "\n") i++;
      row.push(cur); rows.push(row); row = []; cur = "";
    } else cur += c;
  }
  if (cur !== "" || row.length){ row.push(cur); rows.push(row); }
  return rows;
}
async function cargarHoja(){
  if (!SHEET_CSV) return;
  try{
    const r = await fetch(SHEET_CSV);
    if (!r.ok) throw new Error(r.status);
    const rows = parseCSV(await r.text()).filter(f => f.some(x => x.trim()));
    const head = rows.shift().map(h => slug(h));
    const col = (n, d) => { const k = head.indexOf(n); return k >= 0 ? k : d; };
    const [a, b, c, d, e] = [col("nombre",0), col("categoria",1), col("precio",2), col("imagen",3), col("descripcion",4)];
    const lista = rows.map(f => ({
      nombre: (f[a]||"").trim(),
      categoria: (f[b]||"").trim() || "Otros",
      precio: parseInt(String(f[c]||"").replace(/\D/g,""), 10) || 0,
      imagen: (f[d]||"").trim(),
      descripcion: (f[e]||"").trim()
    })).filter(p => p.nombre);
    if (!lista.length) throw new Error("hoja vacía");
    PRODUCTOS = lista; calcCategorias();
    if (!categorias.includes(categoria)) categoria = "Todos";
    pintarFiltros(); pintarProductos();
  }catch(err){ console.warn("No se pudo leer la hoja, se usa la lista de respaldo.", err); }
}
cargarHoja();
